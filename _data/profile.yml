  <p>
    I am a Ph.D. student in mathematical logic at the University of Münster,
    supervised by <a href="https://www.uni-muenster.de/Logik/hils/">Martin Hils</a>.
    I expect to complete my Ph.D. in summer 2027.
  </p>
  <p>
    My research is in model theory, particularly stability and simplicity theory,
    imaginaries, beautiful and lovely pairs, definable groups, and the model theory of fields.
